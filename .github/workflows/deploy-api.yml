name: deploy-api

# Se dispara al tocar el backend o el compose, y también a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths:
      - "PMS centralizado/Backend/**"
      - "docker-compose.aws.yml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

# Ojo: el repositorio es público y el runner corre dentro de la EC2.
# NO agregar "pull_request" aquí, o un fork podría ejecutar código en la instancia.
permissions:
  contents: read

jobs:
  deploy:
    # Runner self-hosted instalado en la propia EC2 (Settings > Actions > Runners).
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Actualizar el código y reconstruir el contenedor
        run: |
          set -euo pipefail
          cd /opt/pms
          git fetch origin main
          git reset --hard origin/main
          docker compose -f docker-compose.aws.yml up -d --build
          docker image prune -f

      - name: Comprobar que la API responde
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            BODY=$(curl -s --max-time 5 http://localhost:4000/api/health/db || true)
            if echo "$BODY" | grep -q '"db":"up"'; then
              echo "API OK: $BODY"
              exit 0
            fi
            echo "esperando a que la API arranque... ($i) $BODY"
            sleep 3
          done
          echo "::error::La API no respondió con db:up"
          docker compose -f /opt/pms/docker-compose.aws.yml logs --tail=60 api || true
          exit 1
