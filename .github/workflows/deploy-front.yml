name: deploy-front

# Se dispara al tocar el frontend, y también a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths:
      - "PMS centralizado/Frontend/**"
      - ".github/workflows/deploy-front.yml"
  workflow_dispatch:

# Mismo criterio que deploy-api: repo público + runner dentro de la EC2,
# así que nada de pull_request.
permissions:
  contents: read

env:
  BUCKET: pms-web-057398475825
  WEBSITE: pms-web-057398475825.s3-website.us-east-2.amazonaws.com
  FRONT_DIR: "/opt/pms/PMS centralizado/Frontend/pms-frontend"

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Traer el código
        run: |
          set -euo pipefail
          cd /opt/pms
          git fetch origin main
          git reset --hard origin/main

      - name: Compilar el SPA
        run: |
          set -euo pipefail
          cd "$FRONT_DIR"
          npm ci --no-audit --no-fund
          VITE_API_URL="https://api.kazehanacloud.com/api" npm run build
          ls -1 build | head -n 20

      - name: Subir al bucket
        run: |
          set -euo pipefail
          cd "$FRONT_DIR/build"

          # Assets con hash: caché larga. index.html y sw.js van aparte, sin caché.
          aws s3 sync . "s3://$BUCKET" --delete \
            --exclude "index.html" --exclude "sw.js" \
            --cache-control "public,max-age=31536000,immutable"

          aws s3 cp ./index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          aws s3 cp ./sw.js "s3://$BUCKET/sw.js" \
            --cache-control "no-cache" --content-type "application/javascript"

          if [ -f ./manifest.webmanifest ]; then
            aws s3 cp ./manifest.webmanifest "s3://$BUCKET/manifest.webmanifest" \
              --cache-control "no-cache" --content-type "application/manifest+json"
          fi

      - name: Comprobar que el sitio responde
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://$WEBSITE/")
          echo "index.html -> HTTP $CODE"
          test "$CODE" = "200"
